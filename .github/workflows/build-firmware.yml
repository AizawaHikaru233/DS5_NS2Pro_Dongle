name: Build firmware

on:
  workflow_call:
    inputs:
      version:
        description: Firmware version string
        required: false
        type: string
        default: dev
      upload_tag:
        description: Release tag to upload UF2 assets to
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Firmware version string
        required: true
        default: dev
      upload_tag:
        description: Optional release tag to upload UF2 assets to
        required: false
        default: ""

permissions:
  contents: write

env:
  PICO_SDK_REF: 2.2.0
  TINYUSB_REF: 0.20.0
  PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
  ARM_TOOLCHAIN_VERSION: 14.2.rel1
  ARM_TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
  ARM_TOOLCHAIN_PATH: ${{ github.workspace }}/arm-toolchain

jobs:
  build:
    name: Build UF2
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3 build-essential ninja-build

      - name: Cache ARM toolchain
        id: cache-arm
        uses: actions/cache@v4
        with:
          path: ${{ env.ARM_TOOLCHAIN_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-arm-${{ env.ARM_TOOLCHAIN_VERSION }}

      - name: Download ARM toolchain
        if: steps.cache-arm.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ARM_TOOLCHAIN_PATH"
          curl -fsSL "$ARM_TOOLCHAIN_URL" | tar -xJ -C "$ARM_TOOLCHAIN_PATH" --strip-components=1

      - name: Add ARM toolchain to PATH
        run: echo "$ARM_TOOLCHAIN_PATH/bin" >> "$GITHUB_PATH"

      - name: Cache Pico SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.PICO_SDK_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pico-sdk-${{ env.PICO_SDK_REF }}-tinyusb-${{ env.TINYUSB_REF }}

      - name: Download Pico SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_REF" https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"
          git -C "$PICO_SDK_PATH" submodule update --init --recursive

      - name: Pin TinyUSB
        run: |
          if ! git -C "$PICO_SDK_PATH/lib/tinyusb" rev-parse -q --verify "refs/tags/$TINYUSB_REF" >/dev/null; then
            git -C "$PICO_SDK_PATH/lib/tinyusb" fetch --depth 1 origin "refs/tags/${TINYUSB_REF}:refs/tags/${TINYUSB_REF}"
          fi
          git -C "$PICO_SDK_PATH/lib/tinyusb" checkout --detach "$TINYUSB_REF"

      - name: Build standard firmware
        env:
          FW_VERSION: ${{ inputs.version || github.event.inputs.version || 'dev' }}
        run: |
          cmake -S . -B build/standard -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -DFIRMWARE_VERSION="$FW_VERSION" \
            -DENABLE_NS2PRO_SERIAL_BRIDGE=ON
          cmake --build build/standard --target ds5_ns2pro_dongle
          mkdir -p artifacts
          cp "build/standard/ds5_ns2pro_dongle_v${FW_VERSION}.uf2" artifacts/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ds5_ns2pro_dongle_uf2
          path: artifacts/*.uf2
          if-no-files-found: error

      - name: Upload release asset
        if: ${{ inputs.upload_tag != '' || github.event.inputs.upload_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_TAG: ${{ inputs.upload_tag || github.event.inputs.upload_tag }}
        run: |
          gh release upload "$UPLOAD_TAG" artifacts/*.uf2 \
            --repo "${{ github.repository }}" \
            --clobber
