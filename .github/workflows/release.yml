name: Release firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 1.0.0
        required: true
        default: 1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    name: Create release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "DS5 NS2Pro Dongle firmware ${{ steps.version.outputs.version }}" \
            --notes "Pico firmware for DS5 and NS2Pro DualSense-compatible dongle." \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            || true

  build:
    name: Build and upload UF2
    needs: prepare
    uses: ./.github/workflows/build-firmware.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      upload_tag: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
